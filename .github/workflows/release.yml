name: release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      # npm trusted publishing: the job's OIDC token is the only credential. Releases are
      # staged; a maintainer approves them on npmjs.com with 2FA.
      id-token: write
    steps:
      - id: release
        uses: xescure/ci/.github/actions/release-images@13428d3b0c261dd457057dbf927b5f0983bb963f # main
        with:
          test-job: ""
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.commit }}
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - run: |
          version=$(nix develop -c jq -r .version package.json)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::$GITHUB_REF_NAME does not match package.json's version $version" >&2
            exit 1
          fi
      - run: nix develop -c make -j build
      - run: nix develop -c npm stage publish --provenance
      - uses: xescure/ci/.github/actions/prod-branch@13428d3b0c261dd457057dbf927b5f0983bb963f # main
        with:
          commit: ${{ steps.release.outputs.commit }}
