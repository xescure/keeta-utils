name: release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      # npm trusted publishing: the job's OIDC token is the only credential.
      id-token: write
    steps:
      - id: release
        uses: xescure/ci/.github/actions/release-images@13428d3b0c261dd457057dbf927b5f0983bb963f # main
        with:
          test-job: ""
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - run: |
          version=$(jq -r .version package.json)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::$GITHUB_REF_NAME does not match package.json's version $version" >&2
            exit 1
          fi
      - run: make -j build
      - run: npm publish --provenance
      - uses: xescure/ci/.github/actions/prod-branch@13428d3b0c261dd457057dbf927b5f0983bb963f # main
        with:
          commit: ${{ steps.release.outputs.commit }}
